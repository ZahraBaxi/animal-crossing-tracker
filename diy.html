<style>
:root{
  --bg:#faf6ec;--bg2:#f3ecdc;--surface:#ffffff;--border:#17161a;--border-lt:#e4dcc8;
  --coral:#ff5a5f;--coral-lt:#ff8084;--leaf:#2fbf71;--leaf-lt:#5cd492;--sun:#ffc93c;--sun-lt:#ffd968;--sky:#4c8dff;--sky-lt:#79aaff;
  --accent:var(--leaf);--accent-lt:var(--leaf-lt);
  --rust:var(--accent);--rust-lt:var(--accent-lt);--moss:var(--leaf);--clay:#c25a10;--wheat:var(--sun);
  --dusk:#83848c;--ink:#16161a;--ink-mid:#4c4d54;--ink-dim:#83848c;--ink-ghost:#b7b8c0;
  --done-bg:#e4f7ec;--done-tx:#1c8c52;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{font-family:'JetBrains Mono',monospace;font-weight:300;background:var(--bg);color:var(--ink);min-height:100vh;padding:0.9rem 0.9rem 3rem;
  overflow-x:hidden;
  background-image:
    linear-gradient(var(--border-lt) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-lt) 1px, transparent 1px);
  background-size:28px 28px;}

/* HEADER */
header{padding:1.6rem 1.8rem 0;border:2px dashed var(--accent);border-radius:16px 16px 0 0;max-width:1060px;margin:0 auto 0;background:var(--surface);}
.header-top{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding-bottom:1.5rem;}
.site-title{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:1.05rem;color:var(--ink);}
.site-title span{color:var(--accent);font-size:0.9rem;}
.site-meta{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--ink-dim);letter-spacing:0.04em;text-transform:uppercase;}
.nav-links{margin-left:auto;display:flex;gap:1rem;align-items:center;}
.back-link{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink-dim);text-decoration:none;letter-spacing:0.04em;border-bottom:2px dashed var(--border-lt);transition:color 0.15s;display:inline-block;padding:0.5rem 0.2rem;margin:-0.5rem -0.2rem;}
.back-link:hover{color:var(--accent);border-color:var(--accent);}
.user-chip{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--ink-dim);}

/* PRIMARY TABS (crafting / food) */
.primary-tab-nav{display:flex;gap:0.4rem;margin-top:1.2rem;}
.primary-tab-btn{font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--bg2);border:none;border-radius:99px 99px 0 0;
  padding:0.6rem 1.4rem 0.7rem;cursor:pointer;white-space:nowrap;transition:color 0.15s,background 0.15s;position:relative;top:1px;}
.primary-tab-btn:hover{color:var(--ink-mid);}
.primary-tab-btn.active{color:#fff;background:var(--accent);}
.primary-tab-btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wheat);margin-right:0.5rem;vertical-align:middle;position:relative;top:-1px;}
.primary-tab-btn.active .dot{background:#fff;}

.wrap{max-width:1060px;margin:0 auto;padding:1.7rem 1.8rem;border:2px dashed var(--border-lt);border-top:none;border-radius:0 0 16px 16px;background:var(--surface);}
.primary-panel{display:none;}.primary-panel.active{display:block;}

/* SECONDARY TABS (sub-tabs) */
.sub-tab-nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:0.4rem;border-bottom:2px dashed var(--border-lt);padding-bottom:0.4rem;margin-bottom:1.8rem;}
.sub-tab-nav::-webkit-scrollbar{display:none;}
.stab{font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--bg2);border:none;border-radius:99px;
  padding:0.5rem 1.1rem;cursor:pointer;white-space:nowrap;transition:color 0.15s,background 0.15s;}
.stab:hover{color:var(--ink-mid);}
.stab.active{color:#fff;background:var(--moss);}
.stab-count{font-size:0.6rem;color:var(--ink-dim);margin-left:0.35rem;}
.stab.active .stab-count{color:rgba(255,255,255,0.75);}
.stab.complete{color:#a97142;}
.stab.complete .stab-count{color:#a97142;}
.stab.complete.active{background:#a97142;color:#fff;}
.stab.complete.active .stab-count{color:rgba(255,255,255,0.8);}
.stab-trophy{margin-right:0.3rem;}
.sub-panel{display:none;}.sub-panel.active{display:block;}

/* SECTION HEADER */
.section-header{display:flex;align-items:center;gap:0.9rem;margin-bottom:1rem;flex-wrap:wrap;}
.section-title{font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-mid);}
.prog-row{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.5rem;}
.prog-track{flex:1;height:6px;background:var(--border-lt);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s;}
.prog-label{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--ink-dim);white-space:nowrap;}
.prog-label strong{color:var(--rust);font-weight:600;}

/* CONTROLS */
.controls-row{display:flex;gap:0.6rem;margin-bottom:1.1rem;flex-wrap:wrap;}
.search-wrap{flex:1 1 200px;display:flex;align-items:center;border:2px solid var(--border-lt);border-radius:99px;background:var(--bg);overflow:hidden;transition:border-color 0.15s;}
.search-wrap:focus-within{border-color:var(--accent);}
.search-wrap input{font-family:'JetBrains Mono',monospace;font-size:16px;border:none;background:transparent;color:var(--ink);padding:0.55rem 0.9rem;outline:none;width:100%;}
.search-wrap input::placeholder{color:var(--ink-dim);}
.filter-btn{font-family:'JetBrains Mono',monospace;font-size:0.68rem;font-weight:500;letter-spacing:0.05em;padding:0.5rem 0.95rem;border:2px solid var(--border-lt);border-radius:99px;background:var(--bg);color:var(--ink-dim);cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.filter-btn:hover{background:var(--bg2);color:var(--ink);border-color:var(--dusk);}
.filter-btn.active{color:#fff;border-color:var(--accent);background:var(--accent);}

/* RECIPE CARDS */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0.7rem;}
.recipe-card{background:var(--surface);border:2px solid var(--border-lt);border-radius:12px;padding:0.9rem 0.95rem;min-height:44px;cursor:pointer;user-select:none;transition:all 0.12s;}
.recipe-card:hover{background:var(--bg2);border-color:var(--accent);}
.recipe-card.obtained{background:var(--done-bg);border-color:var(--moss);}
.recipe-card.obtained:hover{background:#d3f0e0;}
.rc-top{display:flex;align-items:flex-start;gap:0.75rem;}
.rc-check{width:26px;height:26px;border:2px solid var(--border-lt);border-radius:7px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background 0.12s,border-color 0.12s;}
.recipe-card.obtained .rc-check{background:var(--moss);border-color:var(--moss);}
.rc-check svg{display:none;width:14px;height:11px;}.recipe-card.obtained .rc-check svg{display:block;}
.rc-name{font-size:0.82rem;font-weight:500;color:var(--ink);line-height:1.3;}
.recipe-card.obtained .rc-name{color:var(--done-tx);}
.rc-body{margin-top:0.5rem;padding-left:2.55rem;}
.rc-mats{font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--ink-mid);line-height:1.7;}
.recipe-card.obtained .rc-mats{color:#3fa876;}
.rc-mat-item{display:flex;align-items:center;gap:0.3rem;}
.rc-mat-tag{display:inline-block;font-size:0.5rem;letter-spacing:0.03em;border-radius:4px;padding:0.06rem 0.28rem;margin-left:0.2rem;vertical-align:middle;}
.tag-catch{background:rgba(47,191,113,0.12);color:var(--leaf);border:1px solid rgba(47,191,113,0.3);}
.tag-dive{background:rgba(76,141,255,0.12);color:var(--sky);border:1px solid rgba(76,141,255,0.3);}
.rc-obtain{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--ink-dim);margin-top:0.4rem;display:flex;align-items:center;gap:0.35rem;flex-wrap:wrap;}
.recipe-card.obtained .rc-obtain{color:#5cb88f;}
.obtain-pill{display:inline-block;font-size:0.52rem;letter-spacing:0.04em;border-radius:99px;padding:0.08rem 0.42rem;border:1px solid;}
.pill-bottle{background:rgba(131,132,140,0.1);color:var(--dusk);border-color:rgba(131,132,140,0.3);}
.pill-villager{background:rgba(194,90,16,0.1);color:var(--clay);border-color:rgba(194,90,16,0.3);}
.pill-fishing{background:rgba(47,191,113,0.12);color:var(--leaf);border-color:rgba(47,191,113,0.3);}
.pill-nookmiles{background:rgba(255,90,95,0.1);color:var(--coral);border-color:rgba(255,90,95,0.28);}
.pill-nookcranny{background:rgba(255,201,60,0.2);color:#9a7810;border-color:rgba(255,201,60,0.45);}
.pill-daisy{background:rgba(255,90,95,0.1);color:var(--coral);border-color:rgba(255,90,95,0.28);}
.pill-celeste{background:rgba(131,132,140,0.1);color:var(--dusk);border-color:rgba(131,132,140,0.3);}
.pill-balloon{background:rgba(131,132,140,0.1);color:var(--dusk);border-color:rgba(131,132,140,0.3);}
.pill-franklin{background:rgba(255,90,95,0.1);color:var(--coral);border-color:rgba(255,90,95,0.28);}
.pill-brewster{background:rgba(76,141,255,0.1);color:var(--wheat);border-color:rgba(76,141,255,0.28);}
.rc-collect{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--clay);margin-top:0.35rem;font-style:italic;}
.recipe-card.obtained .rc-collect{color:#5cb88f;}
.empty-msg{font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--ink-dim);text-align:center;padding:3rem 1rem;border:2px dashed var(--border-lt);border-radius:14px;}

footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--ink-dim);letter-spacing:0.06em;padding:0 2rem;max-width:1060px;margin:2rem auto 0;}
@media(max-width:600px){
  header{padding:1.3rem 1.1rem 0;}.wrap{padding:1.2rem 1.1rem;}
  .recipe-grid{grid-template-columns:1fr;}
  .rc-check{width:28px;height:28px;}
  .rc-check svg{width:15px;height:12px;}
  .rc-body{padding-left:2.7rem;}
  .filter-btn{padding:0.6rem 1rem;min-height:38px;display:inline-flex;align-items:center;}
  .stab{padding:0.6rem 1.1rem;min-height:38px;display:inline-flex;align-items:center;}
  .primary-tab-btn{padding:0.7rem 1.2rem 0.75rem;min-height:40px;}
}
/* 100% completion celebration */
.confetti-piece{position:fixed;top:-20px;z-index:9999;pointer-events:none;border-radius:2px;
  animation:confettiFall linear forwards;}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  85%{opacity:1;}
  100%{transform:translateY(110vh) rotate(540deg);opacity:0;}
}
.complete-toast{
  position:fixed;top:1.3rem;left:50%;transform:translateX(-50%) translateY(-30px);
  z-index:10000;background:var(--ink);color:#fff;
  border-radius:14px;padding:0.9rem 1.4rem;box-shadow:0 10px 30px -6px rgba(0,0,0,0.35);
  display:flex;align-items:center;gap:0.7rem;max-width:90vw;
  opacity:0;transition:opacity 0.35s ease,transform 0.35s ease;
}
.complete-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.complete-toast-emoji{font-size:1.4rem;flex-shrink:0;}
.complete-toast-text{font-family:'JetBrains Mono',monospace;font-size:0.78rem;line-height:1.4;}
.complete-toast-text strong{color:var(--accent-lt);}
</style>

// ── INGREDIENT TAG HELPERS ───────────────────────────────────────────────────
// "collect" ingredients that need to be gathered (not grown/bought)
const COLLECT_ITEMS=['anchovy','salmon','dab','squid','sea bass','red snapper','horse mackerel','crucian carp',
  'tiger prawn','sweet shrimp','manila clam','scallop','seaweed','bamboo shoot','turnips',
  'round mushroom','flat mushroom','skinny mushroom','rare mushroom','tomato puree',
  'iron nugget','stone','wood','hardwood','softwood','bamboo','young spring bamboo',
  'weed','clump of weeds','acorn','pinecone','maple leaf','star fragment','large star fragment',
  'gold nugget','tree branch','pear','orange','cherry','peach','coconut','apple'];

// Simple "needs to be caught/found" indicator
const CATCH_FISH=['anchovy','salmon','dab','squid','sea bass','red snapper','horse mackerel','crucian carp'];
const CATCH_SEA=['tiger prawn','sweet shrimp','manila clam','scallop','seaweed'];

function matTag(mat){
  const low=mat.toLowerCase();
  if(CATCH_FISH.some(f=>low.includes(f))) return '<span class="rc-mat-tag tag-catch">fish</span>';
  if(CATCH_SEA.some(s=>low.includes(s))) return '<span class="rc-mat-tag tag-dive">dive/beach</span>';
  if(low.includes('mushroom')) return '<span class="rc-mat-tag tag-catch">forage</span>';
  if(low.includes('bamboo shoot')) return '<span class="rc-mat-tag tag-catch">forage</span>';
  if(low.includes('turnip')) return '<span class="rc-mat-tag tag-catch">buy from daisy</span>';
  if(low.includes('weed')||low==='clump of weeds') return '<span class="rc-mat-tag tag-catch">pull weeds</span>';
  return '';
}

// collectNote — special items needed (non-standard)
function collectNote(mats){
  const specials=[];
  mats.forEach(([qty,mat])=>{
    const low=mat.toLowerCase();
    if(CATCH_FISH.some(f=>low.includes(f))) specials.push(mat+' (catch fish)');
    else if(CATCH_SEA.some(s=>low.includes(s))) specials.push(mat+' (dive/beach)');
    else if(low.includes('mushroom')) specials.push(mat+' (forage in Nov)');
    else if(low.includes('bamboo shoot')) specials.push(mat+' (dig bamboo grove)');
    else if(low.includes('turnip')&&!low.includes('fish')) specials.push('Turnips (buy from Daisy Mae on Sunday)');
    else if(low.includes('tomato puree')) specials.push('Tomato puree (craft from 3 tomato)');
    else if(low.includes('weed')) specials.push('Clump of Weeds (pull from ground)');
  });
  return [...new Set(specials)];
}

// ── STATE ───────────────────────────────────────────────────────────────────
let obtained={savory:[],sweet:[],housewares:[],equipment:[],misc:[],wallmounted:[],wallpaper:[],floors:[],rugs:[],other:[],tools:[]};
let parseObj=null;
let primaryTab='food';
let foodTab='savory';
let craftTab='housewares';
let searchQ={savory:'',sweet:'',housewares:'',equipment:'',misc:'',wallmounted:'',wallpaper:'',floors:'',rugs:'',other:'',tools:''};
let filterF={savory:'all',sweet:'all',housewares:'all',equipment:'all',misc:'all',wallmounted:'all',wallpaper:'all',floors:'all',rugs:'all',other:'all',tools:'all'};

const FOOD_SECTIONS={
  savory:{label:'Savory',data:SAVORY},
  sweet:{label:'Sweet',data:SWEET},
};
const CRAFT_SECTIONS={
  housewares:{label:'Housewares',data:HOUSEWARES},
  equipment:{label:'Equipment',data:EQUIPMENT},
  misc:{label:'Miscellaneous',data:MISCELLANEOUS},
  wallmounted:{label:'Wall-mounted',data:WALLMOUNTED},
  wallpaper:{label:'Wallpaper',data:WALLPAPER},
  floors:{label:'Floors',data:FLOORS},
  rugs:{label:'Rugs',data:RUGS},
  other:{label:'Other',data:OTHERCRAFT},
  tools:{label:'Tools',data:TOOLS},
};

(async()=>{
  const u=Parse.User.current();
  if(!u){window.location.href='index.html';return;}
  document.getElementById('userChip').textContent=u.get('email')||u.get('username');
  await loadData();
  buildNav();
  renderAll();
})();

async function loadData(){
  const u=Parse.User.current();
  try{
    const q=new Parse.Query('DIYData');q.equalTo('user',u);
    parseObj=await q.first()||null;
    if(parseObj){
      const saved=parseObj.get('obtained')||{};
      Object.keys(obtained).forEach(k=>{obtained[k]=saved[k]||[];});
    }
  }catch(e){console.error(e);}
}

async function saveData(){
  const u=Parse.User.current();if(!u)return;
  try{
    if(!parseObj){
      const D=Parse.Object.extend('DIYData');parseObj=new D();
      parseObj.set('user',u);
      const acl=new Parse.ACL(u);parseObj.setACL(acl);
    }
    parseObj.set('obtained',obtained);
    await parseObj.save();
  }catch(e){console.error(e);}
}

function buildNav(){
  // Food sub tabs
  const fn=document.getElementById('foodTabNav');
  fn.innerHTML='';
  Object.entries(FOOD_SECTIONS).forEach(([k,s])=>{
    const isComplete=obtained[k].length===s.data.length;
    const b=document.createElement('button');b.className='stab'+(k===foodTab?' active':'')+(isComplete?' complete':'');
    b.id='ftab-'+k;b.onclick=()=>setFoodTab(k);
    b.innerHTML=(isComplete?'<span class="stab-trophy">🏆</span>':'')+s.label+`<span class="stab-count">${obtained[k].length}/${s.data.length}</span>`;
    fn.appendChild(b);
    const p=document.createElement('div');p.className='sub-panel'+(k===foodTab?' active':'');
    p.id='fpanel-'+k;document.getElementById('foodPanels').appendChild(p);
  });
  // Craft sub tabs
  const cn=document.getElementById('craftTabNav');
  cn.innerHTML='';
  Object.entries(CRAFT_SECTIONS).forEach(([k,s])=>{
    const isComplete=obtained[k].length===s.data.length;
    const b=document.createElement('button');b.className='stab'+(k===craftTab?' active':'')+(isComplete?' complete':'');
    b.id='ctab-'+k;b.onclick=()=>setCraftTab(k);
    b.innerHTML=(isComplete?'<span class="stab-trophy">🏆</span>':'')+s.label+`<span class="stab-count">${obtained[k].length}/${s.data.length}</span>`;
    cn.appendChild(b);
    const p=document.createElement('div');p.className='sub-panel'+(k===craftTab?' active':'');
    p.id='cpanel-'+k;document.getElementById('craftPanels').appendChild(p);
  });
}

function renderAll(){
  Object.keys(FOOD_SECTIONS).forEach(k=>renderSection(k,'f'));
  Object.keys(CRAFT_SECTIONS).forEach(k=>renderSection(k,'c'));
  updateNavCounts();
}

function updateNavCounts(){
  Object.entries(FOOD_SECTIONS).forEach(([k,s])=>{
    const b=document.getElementById('ftab-'+k);if(!b)return;
    const isComplete=obtained[k].length===s.data.length;
    const el=b.querySelector('.stab-count');if(el)el.textContent=obtained[k].length+'/'+s.data.length;
    b.classList.toggle('complete',isComplete);
    if(isComplete&&!b.querySelector('.stab-trophy'))b.insertAdjacentHTML('afterbegin','<span class="stab-trophy">🏆</span>');
    if(!isComplete){const t=b.querySelector('.stab-trophy');if(t)t.remove();}
  });
  Object.entries(CRAFT_SECTIONS).forEach(([k,s])=>{
    const b=document.getElementById('ctab-'+k);if(!b)return;
    const isComplete=obtained[k].length===s.data.length;
    const el=b.querySelector('.stab-count');if(el)el.textContent=obtained[k].length+'/'+s.data.length;
    b.classList.toggle('complete',isComplete);
    if(isComplete&&!b.querySelector('.stab-trophy'))b.insertAdjacentHTML('afterbegin','<span class="stab-trophy">🏆</span>');
    if(!isComplete){const t=b.querySelector('.stab-trophy');if(t)t.remove();}
  });
}

function renderSection(key,pfx){
  const SECS=pfx==='f'?FOOD_SECTIONS:CRAFT_SECTIONS;
  const sec=SECS[key];
  const el=document.getElementById((pfx==='f'?'fpanel-':'cpanel-')+key);
  if(!el)return;
  const done=obtained[key].length;
  const total=sec.data.length;
  const pct=total>0?Math.round(done/total*100):0;
  const q=searchQ[key]||'';
  const f=filterF[key]||'all';

  let items=sec.data.map((item,i)=>({item,i}));
  if(q) items=items.filter(x=>x.item.n.toLowerCase().includes(q.toLowerCase()));
  if(f==='obtained') items=items.filter(x=>obtained[key].includes(x.i));
  if(f==='missing') items=items.filter(x=>!obtained[key].includes(x.i));

  let html=`<div class="prog-row">
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-label"><strong>${done}</strong> / ${total} &middot; ${pct}%</div>
  </div>
  <div class="controls-row">
    <div class="search-wrap"><input type="text" placeholder="search..." value="${q.replace(/"/g,'&quot;')}" oninput="setSearch('${key}','${pfx}',this.value)"/></div>
    <button class="filter-btn${f==='all'?' active':''}" onclick="setFilter('${key}','${pfx}','all')">all</button>
    <button class="filter-btn${f==='missing'?' active':''}" onclick="setFilter('${key}','${pfx}','missing')">missing</button>
    <button class="filter-btn${f==='obtained'?' active':''}" onclick="setFilter('${key}','${pfx}','obtained')">obtained</button>
  </div>`;

  if(items.length===0){
    html+='<div class="empty-msg">no results</div>';
  }else{
    html+='<div class="recipe-grid">';
    items.forEach(({item,i})=>{
      const got=obtained[key].includes(i);
      const matHtml=item.mats.map(([qty,mat])=>{
        const tag=matTag(mat);
        return `<div class="rc-mat-item">${qty}× ${mat}${tag}</div>`;
      }).join('');
      const srcHtml=(item.src||[]).join(' ');
      const noteHtml=item.srcNote?`<span style="opacity:0.7;">${item.srcNote}</span>`:'';
      const notes=collectNote(item.mats);
      const collectHtml=notes.length?`<div class="rc-collect">→ need: ${notes.join(', ')}</div>`:'';
      html+=`<div class="recipe-card${got?' obtained':''}" onclick="toggle('${key}','${pfx}',${i})">
        <div class="rc-top">
          <div class="rc-check">${SVG_CHECK}</div>
          <div class="rc-name">${item.n}</div>
        </div>
        <div class="rc-body">
          <div class="rc-mats">${matHtml}</div>
          <div class="rc-obtain">${srcHtml}${noteHtml}</div>
          ${collectHtml}
        </div>
      </div>`;
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

// ── 100% COMPLETION CELEBRATION ────────────────────────────────────────────
const CONFETTI_COLORS=['#ff5a5f','#4c8dff','#ffc93c','#2fbf71'];
function fireConfetti(){
  const count=42;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=5+Math.random()*5;
    p.style.width=size+'px';
    p.style.height=size+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.background=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    const duration=2.2+Math.random()*1.3;
    p.style.animationDuration=duration+'s';
    p.style.animationDelay=(Math.random()*0.3)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(duration+0.3)*1000+200);
  }
}
function celebrate(label){
  fireConfetti();
  const toast=document.createElement('div');
  toast.className='complete-toast';
  toast.innerHTML=`<span class="complete-toast-emoji">🎉</span><span class="complete-toast-text"><strong>${label} complete!</strong><br>every recipe obtained, nice work.</span>`;
  document.body.appendChild(toast);
  requestAnimationFrame(()=>toast.classList.add('show'));
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=>toast.remove(),400);
  },3800);
}

function toggle(key,pfx,idx){
  const arr=obtained[key];
  const pos=arr.indexOf(idx);
  if(pos>=0)arr.splice(pos,1);else arr.push(idx);
  saveData();
  renderSection(key,pfx);
  updateNavCounts();
  const SECS=pfx==='f'?FOOD_SECTIONS:CRAFT_SECTIONS;
  if(pos<0 && arr.length===SECS[key].data.length) celebrate(SECS[key].label);
}

function setSearch(key,pfx,val){
  searchQ[key]=val;renderSection(key,pfx);
}
function setFilter(key,pfx,f){
  filterF[key]=f;renderSection(key,pfx);
}

function setPrimaryTab(t){
  primaryTab=t;
  document.getElementById('ptab-food').classList.toggle('active',t==='food');
  document.getElementById('ptab-crafting').classList.toggle('active',t==='crafting');
  document.getElementById('ppanel-food').classList.toggle('active',t==='food');
  document.getElementById('ppanel-crafting').classList.toggle('active',t==='crafting');
}

function setFoodTab(k){
  foodTab=k;
  document.querySelectorAll('#foodTabNav .stab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#foodPanels .sub-panel').forEach(p=>p.classList.remove('active'));
  const b=document.getElementById('ftab-'+k);if(b)b.classList.add('active');
  const p=document.getElementById('fpanel-'+k);if(p)p.classList.add('active');
  renderSection(k,'f');
}

function setCraftTab(k){
  craftTab=k;
  document.querySelectorAll('#craftTabNav .stab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#craftPanels .sub-panel').forEach(p=>p.classList.remove('active'));
  const b=document.getElementById('ctab-'+k);if(b)b.classList.add('active');
  const p=document.getElementById('cpanel-'+k);if(p)p.classList.add('active');
  renderSection(k,'c');
}
