<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>tv schedule · island tools</title>
<link rel="icon" type="image/jpeg" href="images/favicon/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#faf6ec;--bg2:#f3ecdc;--surface:#ffffff;--border:#17161a;--border-lt:#e4dcc8;
  --coral:#ff5a5f;--coral-lt:#ff8084;--leaf:#2fbf71;--leaf-lt:#5cd492;--sun:#ffc93c;--sun-lt:#ffd968;--sky:#4c8dff;--sky-lt:#79aaff;
  --accent:var(--sun);--accent-lt:var(--sun-lt);
  --rust:var(--accent);--rust-lt:var(--accent-lt);--moss:var(--leaf);--clay:#c25a10;--wheat:var(--sky);
  --dusk:#83848c;--ink:#16161a;--ink-mid:#4c4d54;--ink-dim:#83848c;--ink-ghost:#b7b8c0;
  --glow:rgba(255,201,60,0.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{
  font-family:'JetBrains Mono',monospace;font-weight:300;
  background:var(--bg);color:var(--ink);min-height:100vh;padding:0.9rem 0.9rem 3rem;
  background-image:
    linear-gradient(var(--border-lt) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-lt) 1px, transparent 1px);
  background-size:28px 28px;
}

/* ── HEADER ── */
.header{max-width:820px;margin:0 auto;padding:1.6rem 1.8rem 1.5rem;border:2px dashed var(--accent);border-bottom:none;border-radius:16px 16px 0 0;background:var(--surface);}
.header-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
}
.eyebrow{
  font-size:0.58rem;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:0.6rem;
  display:flex;align-items:center;gap:0.55rem;
}
.eyebrow::before{content:'📡';font-size:0.8rem;}
.page-title{
  font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:300;color:var(--ink);
  line-height:1.1;letter-spacing:-0.015em;
}
.page-title em{color:var(--accent);font-style:normal;font-weight:600;}
.back-link{
  font-size:0.64rem;font-weight:500;letter-spacing:0.06em;color:var(--ink-dim);text-decoration:none;
  border:2px solid var(--border-lt);padding:0.4rem 0.85rem;border-radius:99px;
  transition:all .15s;white-space:nowrap;align-self:flex-start;
  display:inline-flex;align-items:center;gap:0.4rem;
}
.back-link:hover{color:var(--accent-lt);border-color:var(--accent);background:rgba(255,201,60,0.08);}

.channel-bar{
  margin-top:1.1rem;background:var(--ink);color:#fff;border-radius:10px;
  display:flex;align-items:center;justify-content:space-between;gap:0.8rem;flex-wrap:wrap;
  padding:0.55rem 1rem;font-size:0.6rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:500;
}
.ch-num{background:var(--accent);color:var(--ink);border-radius:5px;padding:0.14rem 0.45rem;font-weight:700;margin-right:0.55rem;letter-spacing:0.03em;}
.ch-live{display:flex;align-items:center;gap:0.4rem;font-size:0.58rem;color:var(--ink-ghost);}
.ch-live.live{color:#ffb4b4;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--coral);animation:liveBlink 1.4s infinite;flex-shrink:0;}
@keyframes liveBlink{0%,50%{opacity:1;}51%,100%{opacity:0.2;}}

/* ── STICKY DAY NAV ── */
.day-nav-wrap{
  position:sticky;top:0;z-index:20;
  max-width:820px;margin:0 auto;
  background:var(--surface);
  border-left:2px dashed var(--border-lt);border-right:2px dashed var(--border-lt);
}
.day-nav{
  padding:0.7rem 1.4rem;
  display:flex;gap:0.35rem;overflow-x:auto;scrollbar-width:none;
}
.day-nav::-webkit-scrollbar{display:none}
.day-btn{
  font-family:'JetBrains Mono',monospace;font-size:0.65rem;font-weight:500;letter-spacing:0.07em;
  text-transform:uppercase;color:var(--ink-dim);background:var(--bg2);border:none;
  border-radius:99px;padding:0.5rem 0.95rem;
  cursor:pointer;white-space:nowrap;transition:color .15s,background .15s;
}
.day-btn:hover{color:var(--ink-mid);background:var(--border-lt)}
.day-btn.active{color:#fff;background:var(--accent)}
.today-dot{
  display:none;width:5px;height:5px;border-radius:50%;
  background:var(--coral);margin-left:5px;vertical-align:middle;margin-bottom:1px;
}
.is-today .today-dot{display:inline-block}

/* ── WRAP ── */
.main{max-width:820px;margin:0 auto;padding:1.7rem 1.8rem 2rem;border:2px dashed var(--border-lt);border-top:none;border-radius:0 0 16px 16px;background:var(--surface);}

/* ── NOW BANNER (retro CRT frame) ── */
.now-banner{
  position:relative;
  display:grid;grid-template-columns:1fr auto;gap:0.6rem 1.2rem;
  padding:1.25rem 1.5rem 1.1rem;margin:0 0 2.4rem;border-radius:18px;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 1px, transparent 1px, transparent 4px),
    rgba(255,201,60,0.12);
  border:3px solid var(--ink);
  animation:fadeUp .4s ease both;
}
.now-banner::before,.now-banner::after{
  content:'';position:absolute;top:-13px;width:2px;height:15px;background:var(--ink);border-radius:2px;
}
.now-banner::before{left:34px;transform:rotate(-20deg);transform-origin:bottom;}
.now-banner::after{left:46px;transform:rotate(20deg);transform-origin:bottom;}
.now-banner.hidden{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.now-top{display:flex;align-items:center;gap:0.8rem;grid-column:1}
.now-badge{
  font-size:0.53rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;
  background:var(--accent);color:#fff;padding:0.22rem 0.65rem;border-radius:99px;flex-shrink:0;
  display:inline-flex;align-items:center;gap:0.32rem;
}
.now-badge .live-dot{background:#fff;}
.now-emoji{font-size:1.6rem;line-height:1}
.now-name{
  font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:600;
  color:var(--ink);
}
.now-time{
  font-size:0.62rem;color:var(--ink-dim);text-align:right;grid-column:2;align-self:center;
  line-height:1.8;
}
.now-time strong{display:block;font-size:0.82rem;color:var(--ink-mid);font-weight:500}
.now-next{
  grid-column:1/-1;display:flex;align-items:center;gap:0.55rem;flex-wrap:wrap;
  padding-top:0.7rem;border-top:2px dashed rgba(22,22,26,0.18);
  font-size:0.62rem;color:var(--ink-dim);
}
.now-next-eyebrow{
  font-size:0.54rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-ghost);
}
.now-next-show{color:var(--ink-mid)}

/* ── SCHEDULE ── */
.schedule{display:flex;flex-direction:column}

.hour-header{
  display:flex;align-items:center;gap:0.8rem;
  padding:1.5rem 0 0.6rem;
}
.hour-header:first-child{padding-top:0}
.hour-label{
  font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:600;
  color:var(--ink-mid);letter-spacing:0.04em;flex-shrink:0;
  background:var(--bg2);border-radius:6px;padding:0.2rem 0.55rem;
  text-transform:uppercase;
}
.hour-rule{flex:1;height:0;border-top:2px dashed var(--border-lt);}

/* Slot row */
.slot{
  display:grid;grid-template-columns:68px 1fr;gap:0 0.85rem;
  padding:0.5rem 0.5rem 0.5rem 0;border-radius:10px;
  transition:background .13s;
}
.slot.slot-odd{background:rgba(22,22,26,0.02);}
.slot:hover{background:rgba(255,201,60,0.09)}
.slot.is-now{
  background:rgba(255,201,60,0.1);
  border-radius:12px;margin:0 -0.6rem;padding:0.75rem 0.6rem;
  border:2px dashed var(--accent);
}
.slot.is-past{opacity:0.4}
.slot.is-next{opacity:0.78}

.genre-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;}

.slot-time{
  font-size:0.65rem;color:var(--ink-dim);padding-top:4px;
  letter-spacing:0.02em;line-height:1.35;text-align:right;
  padding-right:0.6rem;border-right:2px dashed var(--border-lt);
}
.slot.is-now .slot-time{color:var(--ink);font-weight:500;border-color:transparent}
.slot.is-next .slot-time{color:var(--ink-mid)}

.slot-body{padding-left:0.1rem}
.slot-show{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap}
.slot-emoji{font-size:1rem;line-height:1;flex-shrink:0}
.slot-name{
  font-family:'JetBrains Mono',monospace;font-size:0.85rem;font-weight:400;color:var(--ink);
  text-transform:capitalize;
}
.slot.is-now .slot-name{color:var(--ink);font-weight:700}
.slot.is-next .slot-name{color:var(--ink-mid)}
.slot.is-past .slot-name{color:var(--ink-dim)}
.badge{
  font-size:0.5rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;
  padding:0.14rem 0.48rem;border-radius:99px;flex-shrink:0;
}
.badge-now{background:var(--accent);color:#fff}
.badge-next{background:var(--bg2);color:var(--ink-dim)}

.slot-cms{
  display:flex;flex-wrap:wrap;gap:0.28rem;margin-top:0.3rem;
  padding-left:1.5rem;
}
.cm-chip{
  font-size:0.56rem;
  color:var(--ink-ghost);background:var(--bg2);
  border:1.5px solid var(--border-lt);
  padding:0.1rem 0.45rem 0.1rem 0.35rem;border-radius:99px;
  display:flex;align-items:center;gap:0.28rem;
}
.cm-chip-t{color:var(--sky);font-size:0.52rem}

/* ── LEGEND ── */
.legend{
  margin-top:2.8rem;padding:1.3rem 1.5rem;
  border:2px dashed var(--border-lt);border-radius:14px;
  background:var(--bg2);
}
.legend-title{
  font-size:0.57rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:0.9rem;
}
.legend-items{display:flex;flex-wrap:wrap;gap:0.5rem}
.legend-item{
  font-size:0.6rem;color:var(--ink-dim);display:flex;align-items:center;gap:0.4rem;
  background:var(--surface);border:1.5px solid var(--border-lt);border-radius:99px;
  padding:0.32rem 0.75rem 0.32rem 0.55rem;
}

footer{
  text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.62rem;
  color:var(--ink-dim);letter-spacing:0.05em;padding:1.6rem 2rem 0;
  max-width:820px;margin:0 auto;
}
footer a{color:var(--accent-lt);text-decoration:none;font-weight:500}

@media(max-width:560px){
  .header,.main{padding-left:1.1rem;padding-right:1.1rem}
  .day-nav{padding:0.7rem 1rem}
  .page-title{font-size:1.6rem}
  .slot-time{font-size:0.6rem}
  .channel-bar{font-size:0.56rem;padding:0.5rem 0.8rem;}
  .now-banner::before,.now-banner::after{display:none;}
}
</style>
</head>

// ── EMOJIS ──
const EMOJI = {
  news:'📰',weather:'🌤',aerobics:'🏃','test pattern':'📡',static:'📺',
  drama:'🎭',nature:'🌿',action:'⚡',cartoon:'🐭',cooking:'🍳',
  talk:'🎙️',comedy:'😄',quiz:'🎮',concert:'🎵',movie:'🎬',tennis:'🎾',
};
function getEmoji(name){
  const k=name.toLowerCase().trim();
  for(const[n,e]of Object.entries(EMOJI)){if(k.startsWith(n))return e}
  return'📺';
}
const GENRE_COLOR={
  news:'var(--sky)',weather:'var(--sky)',aerobics:'var(--leaf)','test pattern':'var(--dusk)',
  static:'var(--dusk)',drama:'var(--coral)',nature:'var(--leaf)',action:'var(--coral)',
  cartoon:'var(--sun)',cooking:'var(--leaf)',talk:'var(--sky)',comedy:'var(--sun)',
  quiz:'var(--coral)',concert:'var(--coral)',movie:'var(--ink-mid)',tennis:'var(--leaf)',
};
function getGenreColor(name){
  const k=name.toLowerCase().trim();
  for(const[n,c]of Object.entries(GENRE_COLOR)){if(k.startsWith(n))return c}
  return'var(--ink-ghost)';
}
const CM_LABEL={abs:'💪 abs',fruit:'🍎 fruit juice',car:'🚗 car',cat:'🐱 cat food',wind:'🌬️ windmills',ufo:'🛸 ufo signal',weather:'🌤 weather'};
const DAY_NAMES=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];

function fmtH(h){
  const intH=Math.floor(h);
  const mins=Math.round((h%1)*60);
  const pad=n=>String(n).padStart(2,'0');
  const ampm=intH<12?'am':'pm';
  const h12=intH===0?12:intH>12?intH-12:intH;
  return mins===0?`${h12} ${ampm}`:`${h12}:${pad(mins)} ${ampm}`;
}

// overnight slots (0-4am) sort after 23:xx
function sortedSlots(d){
  return[...S[d].filter(s=>s.h>=5),...S[d].filter(s=>s.h<5)];
}

const now=new Date();
const todayIdx=now.getDay()===0?6:now.getDay()-1;
const nowH=now.getHours()+now.getMinutes()/60;
let viewDay=todayIdx;

function toComp(h){return h<5?h+24:h}
function getNowIdx(slots){
  const nh=toComp(nowH);
  let idx=0;
  for(let i=0;i<slots.length;i++){if(toComp(slots[i].h)<=nh)idx=i}
  return idx;
}

function buildNav(){
  const nav=document.getElementById('dayNav');
  nav.innerHTML='';
  DAY_NAMES.forEach((name,i)=>{
    const b=document.createElement('button');
    b.className='day-btn'+(i===viewDay?' active':'')+(i===todayIdx?' is-today':'');
    b.innerHTML=name+(i===todayIdx?'<span class="today-dot"></span>':'');
    b.onclick=()=>{viewDay=i;buildNav();render()};
    nav.appendChild(b);
  });
}

function renderChannelBar(){
  const el=document.getElementById('chLive');
  if(viewDay===todayIdx){
    el.className='ch-live live';
    el.innerHTML='<span class="live-dot"></span>on air now';
  }else{
    el.className='ch-live';
    el.innerHTML=`viewing ${DAY_NAMES[viewDay]}`;
  }
}

function renderBanner(){
  const el=document.getElementById('nowBanner');
  if(viewDay!==todayIdx){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  const slots=sortedSlots(todayIdx);
  const ni=getNowIdx(slots);
  const cur=slots[ni], nxt=slots[(ni+1)%slots.length];
  el.innerHTML=`
    <div class="now-top">
      <span class="now-badge"><span class="live-dot"></span>on now</span>
      <span class="now-emoji">${getEmoji(cur.show)}</span>
      <span class="now-name">${cur.show}</span>
    </div>
    <div class="now-time">
      <strong>${fmtH(cur.h)}</strong>
      since
    </div>
    <div class="now-next">
      <span class="now-next-eyebrow">up next</span>
      <span style="color:var(--border)">·</span>
      <span class="now-next-show">${getEmoji(nxt.show)} ${nxt.show} <span style="color:var(--ink-ghost)">at ${fmtH(nxt.h)}</span></span>
    </div>`;
}

function renderSchedule(){
  const list=document.getElementById('schedule');
  list.innerHTML='';
  const slots=sortedSlots(viewDay);
  const ni=viewDay===todayIdx?getNowIdx(slots):-1;
  let lastIntH=null;

  slots.forEach((slot,i)=>{
    const intH=Math.floor(slot.h);
    if(intH!==lastIntH){
      lastIntH=intH;
      const hd=document.createElement('div');
      hd.className='hour-header';
      hd.innerHTML=`<div class="hour-label">${fmtH(intH)}</div><div class="hour-rule"></div>`;
      list.appendChild(hd);
    }

    const isNow=i===ni;
    const isNext=i===ni+1;
    const isPast=ni>=0&&i<ni;
    const d=document.createElement('div');
    d.className='slot'+(isNow?' is-now':isNext?' is-next':isPast?' is-past':'')+(i%2===0?' slot-even':' slot-odd');
    if(isNow)d.id='now-slot';

    const badge=isNow?'<span class="badge badge-now">now</span>':isNext?'<span class="badge badge-next">next</span>':'';
    const cmHtml=slot.cms.length
      ?`<div class="slot-cms">${slot.cms.map(c=>`<span class="cm-chip"><span class="cm-chip-t">:${String(c.m).padStart(2,'0')}</span>${CM_LABEL[c.c]||c.c}</span>`).join('')}</div>`:'';

    d.innerHTML=`
      <div class="slot-time">${fmtH(slot.h)}</div>
      <div class="slot-body">
        <div class="slot-show">
          <span class="genre-dot" style="background:${getGenreColor(slot.show)}"></span>
          <span class="slot-emoji">${getEmoji(slot.show)}</span>
          <span class="slot-name">${slot.show}</span>
          ${badge}
        </div>
        ${cmHtml}
      </div>`;
    list.appendChild(d);
  });

  if(viewDay===todayIdx){
    setTimeout(()=>{
      const el=document.getElementById('now-slot');
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    },150);
  }
}

function render(){renderChannelBar();renderBanner();renderSchedule()}
buildNav();
render();
