<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>island tools</title>
<link rel="icon" type="image/jpeg" href="images/favicon/favicon.jpg">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"/>

  Parse.serverURL = "https://parseapi.back4app.com/";

<style>
:root{
  --bg:#faf6ec;--bg2:#f3ecdc;--surface:#ffffff;--border:#17161a;--border-lt:#e4dcc8;
  --coral:#ff5a5f;--coral-lt:#ff8084;--leaf:#2fbf71;--leaf-lt:#5cd492;--sun:#ffc93c;--sun-lt:#ffd968;--sky:#4c8dff;--sky-lt:#79aaff;
  --rust:var(--coral);--rust-lt:var(--coral-lt);--moss:var(--leaf);--clay:var(--sun);--wheat:var(--sky);
  --dusk:#83848c;--ink:#16161a;--ink-mid:#4c4d54;--ink-dim:#83848c;--ink-ghost:#b7b8c0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
html{font-size:15px;}
body{
  font-family:'JetBrains Mono',monospace;font-weight:300;background:var(--bg);color:var(--ink);
  overflow-x:hidden;position:relative;
  background-image:
    linear-gradient(var(--border-lt) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-lt) 1px, transparent 1px);
  background-size:28px 28px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 6% 4%, rgba(255,90,95,0.11), transparent 40%),
    radial-gradient(circle at 94% 90%, rgba(76,141,255,0.11), transparent 42%),
    radial-gradient(circle at 88% 8%, rgba(255,201,60,0.09), transparent 36%),
    radial-gradient(circle at 12% 94%, rgba(47,191,113,0.09), transparent 38%);
}

/* ── AUTH ── */
.auth-overlay{
  position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:2rem;
  background-image:
    radial-gradient(circle at 6% 4%, rgba(255,90,95,0.11), transparent 40%),
    radial-gradient(circle at 94% 90%, rgba(76,141,255,0.11), transparent 42%),
    radial-gradient(circle at 88% 8%, rgba(255,201,60,0.09), transparent 36%),
    linear-gradient(var(--border-lt) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-lt) 1px, transparent 1px);
  background-size:auto,auto,auto,28px 28px,28px 28px;
}
.auth-box{width:100%;max-width:360px;animation:fadeUp 0.4s ease both;background:var(--surface);border:2.5px dashed var(--coral);border-radius:20px;padding:2.2rem 2rem;box-shadow:0 10px 30px -8px rgba(255,90,95,0.15);}
.auth-wordmark{font-size:0.65rem;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:1.6rem;}
.auth-title{font-size:2rem;font-weight:300;color:var(--ink);line-height:1.1;margin-bottom:0.5rem;letter-spacing:-0.01em;}
.auth-title em{color:var(--coral);font-style:normal;font-weight:600;}
.auth-sub{font-size:0.75rem;color:var(--ink-dim);line-height:1.65;margin-bottom:1.8rem;}
.auth-tabs{display:flex;gap:0.4rem;margin-bottom:1.4rem;background:var(--bg2);border-radius:99px;padding:0.25rem;}
.auth-tab{font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;background:none;border:none;border-radius:99px;padding:0.4rem 0.9rem;cursor:pointer;color:var(--ink-dim);flex:1;transition:color .15s,background .15s;}
.auth-tab.active{color:#fff;background:var(--ink);}
.auth-field{display:flex;flex-direction:column;gap:0.3rem;margin-bottom:0.85rem;}
.auth-field label{font-size:0.58rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-dim);}
.auth-field input{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:16px;padding:0.6rem 0.9rem;border:2px solid var(--border-lt);border-radius:12px;background:var(--bg);color:var(--ink);outline:none;transition:border-color .15s;}
.auth-field input:focus{border-color:var(--coral);}
.auth-err{font-size:0.65rem;color:var(--coral);margin-bottom:0.7rem;min-height:0.9rem;}
.btn-auth{font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;padding:0.7rem 1.4rem;border-radius:99px;border:2px solid var(--ink);cursor:pointer;background:var(--ink);color:#fff;width:100%;transition:transform .12s,background .15s;}
.btn-auth:hover{background:var(--coral);border-color:var(--coral);transform:translateY(-1px);}
.btn-auth:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* ── MAIN LAYOUT ── */
.main-content{display:none;}
.main-content.visible{display:grid;height:100vh;max-height:100vh;grid-template-rows:auto 1fr auto;overflow:hidden;padding:0.9rem;gap:0.9rem;}

/* ── TOP BAR ── */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;
  padding:1rem 1.7rem;
  border:2px dashed var(--coral);border-radius:18px;
  background:var(--surface);
  box-shadow:0 4px 14px rgba(255,90,95,0.08);
}
.top-bar-left{display:flex;align-items:center;gap:0.9rem;min-width:0;}
.top-bar-icon{
  width:44px;height:44px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.35rem;
  background:color-mix(in srgb, var(--coral) 10%, var(--bg));
  border:2px dashed var(--coral);
  animation:iconBob 3.2s ease-in-out infinite;
}
@keyframes iconBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-3px) rotate(-4deg);}}
.top-bar-text{display:flex;flex-direction:column;gap:0.22rem;min-width:0;}
.site-wordmark{
  font-size:1.12rem;font-weight:500;
  letter-spacing:-0.01em;color:var(--ink);
}
.site-wordmark span{color:var(--coral);}
.site-wordmark sub{font-size:0.55rem;letter-spacing:0.12em;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:5px;padding:0.1rem 0.35rem;vertical-align:middle;margin-left:0.5rem;}
.site-tagline{font-size:0.63rem;color:var(--ink-dim);letter-spacing:0.01em;white-space:nowrap;}
.top-bar-right{display:flex;align-items:center;gap:0.9rem;flex-shrink:0;}
.user-email{font-size:0.6rem;color:var(--ink-dim);}
.time-badge{
  display:flex;align-items:center;gap:0.35rem;
  font-size:0.62rem;color:var(--ink-dim);
  background:var(--bg2);border-radius:99px;padding:0.32rem 0.75rem;
  flex-shrink:0;white-space:nowrap;
}
.time-badge .tb-emoji{font-size:0.78rem;line-height:1;}
.btn-logout{font-size:0.58rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:0.45rem 0.9rem;border:2px solid var(--border-lt);border-radius:99px;background:none;color:var(--ink-dim);cursor:pointer;transition:all .15s;flex-shrink:0;}
.btn-logout:hover{border-color:var(--coral);color:var(--coral);}

/* ── BODY GRID ── */
.body-grid{display:grid;grid-template-columns:1fr 2fr;gap:0.9rem;overflow:hidden;min-height:0;}

/* ── SIDEBAR ── */
.sidebar{border:2px dashed var(--sky);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:0 4px 14px rgba(76,141,255,0.08);}

.sidebar-header{
  padding:1.3rem 1.6rem 0;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0;
}
.sidebar-tabbar{display:flex;flex-shrink:0;gap:0.4rem;padding:0.9rem 1.1rem 0;background:var(--surface);}
.stab{font-size:0.62rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;background:var(--bg2);border:none;border-radius:99px 99px 0 0;padding:0.6rem 1.1rem;cursor:pointer;color:var(--ink-dim);transition:color .15s,background .15s,transform .15s;white-space:nowrap;display:flex;align-items:center;gap:0.4rem;}
.stab-emoji{font-size:0.82rem;line-height:1;}
.stab:hover{color:var(--ink-mid);transform:translateY(-1px);}
.stab.active{color:#fff;background:var(--sky);}

.sidebar-panel{flex:1;overflow-y:auto;padding:1.4rem 1.6rem;display:none;}
.sidebar-panel.active{display:block;}

/* ── TV WIDGET (inside today panel) ── */
.tv-block{
  margin-bottom:1.4rem;
  border:2px dashed var(--sun);border-radius:14px;
  overflow:hidden;
}
.tv-block-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0.5rem 0.85rem;
  background:var(--ink);
}
.tv-live-badge{
  display:flex;align-items:center;gap:0.4rem;
  font-size:0.55rem;font-weight:500;
  letter-spacing:0.13em;text-transform:uppercase;color:#fff;
}
.tv-live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--coral);flex-shrink:0;
  box-shadow:0 0 0 0 rgba(255,90,95,0.5);
  animation:livePulse 2s ease infinite;
}
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(255,90,95,0.5);}
  60%{box-shadow:0 0 0 5px rgba(255,90,95,0);}
  100%{box-shadow:0 0 0 0 rgba(255,90,95,0);}
}
.tv-block-link{
  font-size:0.52rem;font-weight:500;
  letter-spacing:0.06em;color:var(--ink-ghost);
  text-decoration:none;transition:color .13s;
}
.tv-block-link:hover{color:var(--sun);}
.tv-block-body{padding:0.8rem 0.9rem;background:var(--surface);}
.tv-now-row{display:flex;align-items:center;gap:0.6rem;margin-bottom:0.45rem;}
.tv-emoji{font-size:1.1rem;line-height:1;flex-shrink:0;}
.tv-show{font-size:0.88rem;font-weight:500;color:var(--ink);flex:1;}
.tv-time{font-size:0.58rem;color:var(--ink-dim);flex-shrink:0;}
.tv-next-row{
  display:flex;align-items:center;gap:0.45rem;
  padding-top:0.42rem;border-top:2px dashed var(--border-lt);
}
.tv-next-label{font-size:0.54rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-ghost);flex-shrink:0;}
.tv-next-show{font-size:0.62rem;color:var(--ink-dim);}
.tv-next-time{font-size:0.54rem;color:var(--ink-ghost);margin-left:auto;}

/* ── DAILY CHECKLIST ── */
.day-hero{margin-bottom:1rem;display:flex;align-items:center;gap:0.9rem;}
.day-hero-badge{
  width:48px;height:48px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  background:color-mix(in srgb, var(--sky) 10%, var(--bg));
  border:2px dashed var(--sky);
}
.day-hero-text{min-width:0;}
.day-name{font-size:1.55rem;font-weight:300;color:var(--ink);line-height:1;letter-spacing:-0.01em;}
.day-date{font-size:0.6rem;color:var(--ink-dim);margin-top:0.3rem;}
.day-progress-wrap{margin-bottom:1.3rem;}
.day-progress-track{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-bottom:0.45rem;}
.day-progress-fill{height:100%;border-radius:99px;background:var(--sky);transition:width .3s ease;}
.day-tally{font-size:0.58rem;color:var(--ink-dim);}
.day-tally span{color:var(--coral);font-weight:600;}

.day-banner{display:flex;gap:0.5rem;align-items:flex-start;padding:0.6rem 0.8rem;border-radius:12px;background:rgba(255,201,60,0.15);border:2px dashed var(--sun);margin-bottom:0.6rem;}
.db-icon{font-size:0.85rem;flex-shrink:0;margin-top:1px;}
.db-text{font-size:0.74rem;color:var(--ink-mid);line-height:1.5;}
.db-text strong{color:var(--coral);}

.chk-group{margin-bottom:1.1rem;}
.chk-group-label{font-size:0.55rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--ink-ghost);padding-bottom:0.35rem;margin-bottom:0.45rem;border-bottom:2px dashed var(--border-lt);}
.chk-item{display:flex;align-items:flex-start;gap:0.7rem;padding:0.5rem 0;min-height:44px;cursor:pointer;user-select:none;}
.chk-item:hover .chk-box{border-color:var(--leaf);}
.chk-box{width:22px;height:22px;border:2px solid var(--border-lt);border-radius:7px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.chk-item.done .chk-box{background:var(--leaf);border-color:var(--leaf);}
.chk-box svg{display:none;width:13px;height:10px;}
.chk-item.done .chk-box svg{display:block;}
.chk-label{font-size:0.78rem;color:var(--ink);line-height:1.45;}
.chk-item.done .chk-label{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--border-lt);}
.chk-note{display:block;font-size:0.59rem;color:var(--ink-dim);margin-top:0.06rem;line-height:1.4;}
.chk-item.done .chk-note{text-decoration:none;color:var(--ink-ghost);}

/* ── upcoming event ── */
.upcoming-block{margin-top:1.3rem;padding-top:1.1rem;border-top:2px dashed var(--border-lt);}
.upcoming-eyebrow{font-size:0.55rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:0.55rem;}
.upcoming-card{border:2px dashed var(--border-lt);border-radius:14px;padding:0.85rem 1rem;background:var(--surface);}
.upcoming-card.is-now{border-color:var(--coral);background:rgba(255,90,95,0.06);}
.upcoming-name{font-size:0.86rem;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.18rem;}
.upcoming-date{font-size:0.61rem;color:var(--ink-dim);margin-bottom:0.35rem;}
.upcoming-desc{font-size:0.61rem;color:var(--ink-dim);line-height:1.5;}
.upcoming-card.is-now .upcoming-date{color:var(--coral);}

/* ── SEASONAL CALENDAR ── */
.cal-now-label{font-size:0.55rem;font-weight:500;letter-spacing:0.13em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:0.9rem;}
.cal-month{margin-bottom:1.5rem;}
.cal-month-head{font-size:0.6rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral);margin-bottom:0.55rem;padding-bottom:0.3rem;border-bottom:2px dashed var(--border-lt);}
.cal-row{display:flex;gap:0.7rem;padding:0.38rem 0;border-bottom:1px solid var(--border-lt);}
.cal-row:last-child{border-bottom:none;}
.cal-row.is-now{background:rgba(255,90,95,0.06);border-radius:10px;margin:0 -0.35rem;padding:0.38rem 0.35rem;}
.cal-date{font-size:0.61rem;color:var(--ink-dim);min-width:56px;flex-shrink:0;padding-top:2px;line-height:1.3;}
.cal-name{font-size:0.77rem;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:0.38rem;flex-wrap:wrap;}
.cal-desc{font-size:0.59rem;color:var(--ink-dim);margin-top:0.08rem;line-height:1.45;}
.ctag{font-size:0.5rem;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;padding:0.1rem 0.45rem;border-radius:99px;vertical-align:middle;}
.ctag-event{background:var(--coral);color:#fff;}
.ctag-tourney{background:var(--sun);color:var(--ink);}
.ctag-shop{background:var(--sky);color:#fff;}
.ctag-weekly{background:var(--leaf);color:#fff;}

/* ── TOOLS AREA ── */
.tools-area{
  padding:0;display:flex;flex-direction:column;overflow:hidden;min-height:0;
  position:relative;
  border:2px dashed var(--leaf);border-radius:16px;background:var(--surface);
  box-shadow:0 4px 14px rgba(47,191,113,0.08);
}
.tools-header{
  padding:1.3rem 1.8rem 0;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0;
}
.tools-label{font-size:0.58rem;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-dim);}
.tools-count{font-size:0.55rem;color:#fff;background:var(--leaf);border-radius:99px;padding:0.15rem 0.55rem;}

.tool-grid{
  margin:1.1rem 1.5rem 1.5rem;display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-auto-rows:minmax(100px,1fr);
  gap:0.8rem;
  overflow-y:auto;flex:1;min-height:0;
}
.tool-grid .tool-card:nth-child(5){grid-column:1/-1;}

/* Cards with big index number, cycling accent color per card */
.tool-card{
  --accent:var(--coral);
  background:var(--bg);padding:1.1rem 1.4rem;
  text-decoration:none;color:inherit;
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-rows:1fr auto;
  gap:0 1rem;
  border:2px dashed var(--border-lt);border-radius:14px;
  transition:background .13s,border-color .13s,transform .13s;position:relative;overflow:hidden;
  min-height:0;
}
.tool-card:nth-child(4n+1){--accent:var(--coral);}
.tool-card:nth-child(4n+2){--accent:var(--sky);}
.tool-card:nth-child(4n+3){--accent:var(--sun);}
.tool-card:nth-child(4n+4){--accent:var(--leaf);}
.tool-card:nth-child(5){--accent:#c2603d;}
.tool-card:hover{background:var(--surface);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 20px -6px color-mix(in srgb, var(--accent) 35%, transparent);}
.tool-card.card-complete{border:2px solid #a97142;background:linear-gradient(135deg, rgba(255,201,60,0.1), rgba(169,113,66,0.06));}
.tool-card.card-complete:hover{border-color:#a97142;box-shadow:0 8px 20px -6px rgba(169,113,66,0.35);}
.tool-card.card-complete .card-prog{background:#a97142;}

.card-num{
  font-size:1.15rem;font-weight:600;
  color:var(--accent);
  line-height:1;grid-row:1/3;align-self:center;
  transition:background .18s,color .18s,transform .22s;
  width:2.5rem;height:2.5rem;flex-shrink:0;
  border-radius:50%;border:2px dashed var(--accent);
  background:color-mix(in srgb, var(--accent) 10%, var(--bg));
  display:flex;align-items:center;justify-content:center;
  letter-spacing:-0.02em;
}
.tool-card:hover .card-num{background:color-mix(in srgb, var(--accent) 16%, var(--bg));transform:rotate(-8deg) scale(1.08);}

.card-main{grid-column:2;grid-row:1;display:flex;flex-direction:column;gap:0.15rem;justify-content:center;}
.card-tag{font-size:0.54rem;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);}
.card-title{font-size:1.05rem;font-weight:500;color:var(--ink);letter-spacing:-0.01em;line-height:1.15;}
.card-desc{font-size:0.73rem;color:var(--ink-mid);line-height:1.5;grid-column:2;grid-row:2;padding-top:0.3rem;align-self:end;}

.card-side{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:0.5rem;min-width:70px;}
.card-arrow{
  font-size:1.1rem;color:var(--accent);font-weight:600;
  opacity:0;transform:translateX(-6px);
  transition:opacity .15s,transform .15s;
}
.tool-card:hover .card-arrow{opacity:1;transform:translateX(0);}
.card-prog{
  font-size:0.58rem;font-weight:500;color:#fff;
  background:var(--accent);
  padding:0.15rem 0.5rem;border-radius:99px;white-space:nowrap;
  text-align:right;
}
.card-pills{display:flex;flex-wrap:wrap;gap:0.3rem;justify-content:flex-end;grid-column:2;grid-row:2;padding-top:0.3rem;align-self:end;}
.card-pill{font-size:0.52rem;letter-spacing:0.04em;text-transform:uppercase;padding:0.14rem 0.45rem;border-radius:99px;border:1.5px dashed var(--border-lt);color:var(--ink-ghost);background:transparent;}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.tool-card{animation:fadeUp 0.35s ease both;}
.tool-card:nth-child(1){animation-delay:.05s;}
.tool-card:nth-child(2){animation-delay:.12s;}
.tool-card:nth-child(3){animation-delay:.19s;}
.tool-card:nth-child(4){animation-delay:.26s;}
.tool-card:nth-child(5){animation-delay:.33s;}

/* ── FOOTER ── */
footer{
  text-align:center;font-size:0.58rem;
  color:var(--ink-ghost);letter-spacing:0.05em;padding:0.8rem 2rem;
  border:2px dashed var(--sun);border-radius:16px;background:var(--surface);
  box-shadow:0 4px 14px rgba(255,201,60,0.08);
}

/* ── MOBILE ── */
@media(max-width:720px){
  .main-content.visible{display:flex;flex-direction:column;height:auto;max-height:none;overflow:auto;padding:0.6rem;gap:0.6rem;}
  .body-grid{grid-template-columns:1fr;gap:0.6rem;overflow:visible;}
  .sidebar{max-height:480px;}
  .tools-area{overflow:visible;}

// ── TIME OF DAY ──
function timeOfDay(h){
  if(h<5)return{emoji:'🌙',label:'late night'};
  if(h<7)return{emoji:'🌅',label:'early morning'};
  if(h<12)return{emoji:'☀️',label:'morning'};
  if(h<17)return{emoji:'🌤️',label:'afternoon'};
  if(h<20)return{emoji:'🌇',label:'evening'};
  return{emoji:'🌙',label:'night'};
}
function fmtClock(now){
  let h=now.getHours(),m=String(now.getMinutes()).padStart(2,'0'),ap=h<12?'am':'pm';
  h=h%12;if(h===0)h=12;
  return`${h}:${m}${ap}`;
}
function tickTimeBadge(){
  const el=document.getElementById('timeBadge');if(!el)return;
  const now=new Date(),tod=timeOfDay(now.getHours()+now.getMinutes()/60);
  el.innerHTML=`<span class="tb-emoji">${tod.emoji}</span>${fmtClock(now)}`;
}

(()=>{

  const tod=timeOfDay(new Date().getHours());

}

async function doAuth(){
  const tab=document.getElementById('authOverlay').dataset.tab;
  const email=document.getElementById('authEmail').value.trim();
  const pass=document.getElementById('authPassword').value;
  const btn=document.getElementById('authBtn'),err=document.getElementById('authErr');
  if(!email||!pass){err.textContent='please fill in all fields.';return;}

function tvEm(s){const k=s.toLowerCase();for(const[n,e]of Object.entries(TV_EM)){if(k.startsWith(n))return e;}return'📺';}
function tvFmt(h){const i=Math.floor(h),m=Math.round((h%1)*60),p=n=>String(n).padStart(2,'0'),ap=i<12?'am':'pm',h12=i===0?12:i>12?i-12:i;return m===0?`${h12}${ap}`:`${h12}:${p(m)}${ap}`;}

function renderTVBlock(container){
  const now=new Date();
  const di=now.getDay()===0?6:now.getDay()-1;
  const nh=now.getHours()+now.getMinutes()/60;
  const toC=h=>h<5?h+24:h;
  const slots=[...TV_NH[di].filter(s=>s.h>=5),...TV_NH[di].filter(s=>s.h<5)];
  let ni=0;for(let i=0;i<slots.length;i++){if(toC(slots[i].h)<=toC(nh))ni=i;}
  const cur=slots[ni],nxt=slots[(ni+1)%slots.length];
  const el=document.createElement('div');
  el.className='tv-block';
  el.innerHTML=`
    <div class="tv-block-head">
      <div class="tv-live-badge">
        <span class="tv-live-dot"></span>
        live · on tv now
      </div>
      <a class="tv-block-link" href="tv-schedule.html">full schedule →</a>
    </div>
    <div class="tv-block-body">
      <div class="tv-now-row">
        <span class="tv-emoji">${tvEm(cur.s)}</span>
        <span class="tv-show">${cur.s}</span>
        <span class="tv-time">${tvFmt(cur.h)}</span>
      </div>
      <div class="tv-next-row">
        <span class="tv-next-label">up next</span>
        <span class="tv-next-show">${tvEm(nxt.s)} ${nxt.s}</span>
        <span class="tv-next-time">${tvFmt(nxt.h)}</span>
      </div>
    </div>`;
  container.prepend(el);
}

  TOOLS.forEach((tool,i)=>{
    const a=document.createElement('a');a.className='tool-card';a.href=tool.href;a.id='tc'+i;
    const ps=tool.progress?`<span class="card-prog" id="prog-${i}" style="opacity:0.4">&hellip;</span>`:'';
    a.innerHTML=`
      <div class="card-num">${tool.emoji||('0'+(i+1))}</div>

      <div class="card-desc">${tool.desc}</div>`;
    grid.appendChild(a);
  });
  TOOLS.forEach(async(tool,i)=>{
    if(!tool.progress)return;
    try{
      const p=await tool.progress();const el=document.getElementById('prog-'+i);if(!el)return;
      if(p&&p.total>0){
        const isComplete=p.done>=p.total;
        el.textContent=(isComplete?'🏆 ':'')+p.done+'/'+p.total+' · '+Math.round(p.done/p.total*100)+'%';
        el.style.opacity='1';
        document.getElementById('tc'+i)?.classList.toggle('card-complete',isComplete);
      }
      else{el.textContent='0% collected';el.style.opacity='0.5';}
    }catch{const el=document.getElementById('prog-'+i);if(el)el.textContent='';}
  });
}

const SVG='<svg width="13" height="10" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3.5 6L8 1" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DAY_NAMES=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MON_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function todayKey(){const d=new Date();return`acnh_daily_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;}
function loadChecked(){try{return JSON.parse(localStorage.getItem(todayKey())||'[]');}catch{return[];}}
function saveChecked(arr){localStorage.setItem(todayKey(),JSON.stringify(arr));}

const GROUP_EMOJI={island:'🏝️',shops:'🛍️',sunday:'🌿',saturday:'🎸',monday:'🐣'};
function renderToday(){
  const now=new Date(), dow=now.getDay(), mo=now.getMonth();
  const checked=loadChecked();
  const todayTasks=TASKS.filter(t=>{
    if(t.days&&!t.days.includes(dow))return false;
    if(t.months&&!t.months.includes(mo))return false;
    return true;
  });
  const done=todayTasks.filter(t=>checked.includes(t.id)).length;
  const total=todayTasks.length;
  const pct=total?Math.round(done/total*100):0;
  const cntEl=document.getElementById('plannerCount');if(cntEl)cntEl.textContent=`${done}/${total} today`;
  const banners=[];
  if(dow===0&&mo!==7)banners.push({icon:'🌿',text:'<strong>Daisy Mae</strong> is visiting until noon, buy turnips before 12pm!'});
  if(dow===0&&mo===7)banners.push({icon:'🎆',text:'<strong>Fireworks Sunday</strong> + <strong>Daisy Mae</strong> until noon. Redd\'s raffle tonight.'});
  if(dow===6)banners.push({icon:'🎸',text:'<strong>K.K. Slider</strong> performs from 6pm. Request any song by exact title.'});
  const groupOrder=[],groupMap={};
  todayTasks.forEach(t=>{
    if(!groupMap[t.group]){groupMap[t.group]=[];groupOrder.push(t.group);}
    groupMap[t.group].push(t);
  });
  let html=`<div class="day-hero">
    <div class="day-hero-badge">${timeOfDay(now.getHours()+now.getMinutes()/60).emoji}</div>
    <div class="day-hero-text">
      <div class="day-name">${DAY_NAMES[dow]}</div>
      <div class="day-date">${MON_NAMES[mo]} ${now.getDate()}, ${now.getFullYear()}</div>
    </div>
  </div>
  <div class="day-progress-wrap">
    <div class="day-progress-track"><div class="day-progress-fill" style="width:${pct}%"></div></div>
    <div class="day-tally"><span>${done}</span> / ${total} done &nbsp;&middot;&nbsp; resets at midnight</div>
  </div>`;
  banners.forEach(b=>{html+=`<div class="day-banner"><div class="db-icon">${b.icon}</div><div class="db-text">${b.text}</div></div>`;});
  groupOrder.forEach(group=>{
    html+=`<div class="chk-group"><div class="chk-group-label">${GROUP_EMOJI[group]||''} ${group}</div>`;
    groupMap[group].forEach(t=>{
      const isDone=checked.includes(t.id);
      html+=`<div class="chk-item${isDone?' done':''}" onclick="toggleTask('${t.id}')">
        <div class="chk-box">${SVG}</div>
        <div><div class="chk-label">${t.text}</div>${t.note?`<span class="chk-note">${t.note}</span>`:''}</div>
      </div>`;
    });
    html+='</div>';
  });
  const panelEl=document.getElementById('panel-today');
  panelEl.innerHTML=html;
  renderTVBlock(panelEl);
  renderUpcoming(panelEl);
}

function toggleTask(id){
  const arr=loadChecked(),pos=arr.indexOf(id);
  if(pos>=0)arr.splice(pos,1);else arr.push(id);
  saveChecked(arr);renderToday();
}

const MONTH_NAMES_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];

function getUpcomingEvent(){
  const now=new Date(),mo=now.getMonth();
  const order=[...Array(12)].map((_,i)=>(mo+i)%12);
  for(const m of order){
    const evs=EVENTS.filter(e=>e.mo===m&&(e.tag==='event'||e.tag==='tourney'||e.tag==='weekly'));
    if(!evs.length)continue;
    return{ev:evs[0],isNow:(m===mo)};
  }
  return null;
}
function renderUpcoming(panelEl){
  const result=getUpcomingEvent();if(!result)return;
  const{ev,isNow}=result;
  const tagHtml=`<span class="ctag ctag-${ev.tag}">${ev.tag}</span>`;
  panelEl.insertAdjacentHTML('beforeend',`
    <div class="upcoming-block">
      <div class="upcoming-eyebrow">${isNow?'happening now / soon':'coming up next'}</div>
      <div class="upcoming-card${isNow?' is-now':''}">
        <div class="upcoming-name">${tagHtml}${ev.name}</div>
        <div class="upcoming-date">${ev.d}</div>
        <div class="upcoming-desc">${ev.desc}</div>
      </div>
    </div>`);
}
function renderCalendar(){
  const now=new Date(),curMo=now.getMonth();
  const order=[...Array(12)].map((_,i)=>(curMo+i)%12);
  let html=`<div class="cal-now-label">starting from ${MONTH_NAMES_FULL[curMo].toLowerCase()}</div>`;
  order.forEach(mo=>{
    const evs=EVENTS.filter(e=>e.mo===mo);if(!evs.length)return;
    html+=`<div class="cal-month"><div class="cal-month-head">${MONTH_NAMES_FULL[mo]}</div>`;
    evs.forEach(e=>{
      html+=`<div class="cal-row${mo===curMo?' is-now':''}">
        <div class="cal-date">${e.d}</div>
        <div class="cal-body"><div class="cal-name"><span class="ctag ctag-${e.tag}">${e.tag}</span>${e.name}</div><div class="cal-desc">${e.desc}</div></div>
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('panel-calendar').innerHTML=html;
}

  document.getElementById('authOverlay').style.display='none';
